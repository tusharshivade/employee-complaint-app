name: CI/CD Pipeline - Employee Complaint App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/employee-comlaint-app
jobs:
  build-test-and-deploy:
    name: Build, Test,push,Deploy
    runs-on: [ self-hosted, Linux, X64 ]

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 3. Check Code Syntax
        run: |
          python -m py_compile app.py

      - name: 4. Log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets:DOCKERHUB USERNAME }}
          PASSWORD: ${{ secrets:DOCKERHUB_TOKEN }}

      - name: 5. Build and push Docker image to Docker hub
        run: |
        
        # Build and tag image with latest and commit SHA
        docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha}} .

        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ gitub.sha }}
        
      - name: 6. Docker container via Docker compose
        run: |
          docker compose down
          docker compose -d --build
      - name: 7. verify Active containers
        run: |
         docker compose ps
