apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-app
  namespace: employee-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-app

  template:
    metadata:
      labels:
        app: employee-app

    spec:
      containers:
        - name: employee-app

          image: YOUR_DOCKERHUB_USERNAME/employee-complaint-app:latest

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              value: mysql-service

            - name: MYSQL_PORT
              value: "3306"

            - name: MYSQL_USER
              value: root

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DB
              value: employee_db

            - name: SECRET_KEY
              value: employee-complaint-secret-key

          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"